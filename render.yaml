services:
  - type: web
    name: shopai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python data/seed_data.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free
